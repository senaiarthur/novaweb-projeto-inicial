<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Bem vindo ao Perfil</h1>
    </header>

    <main>

        <form class="form" onsubmit="return false;">

            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;"></div>

            <div>
                <img src="perfil.jpg" alt="Foto do Perfil" width="150"
                    onmouseover="console.log('Mouse sobre a imagem')">
            </div>

            <div class="form-group">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" value="Luva de Pedro">
            </div>

            <div>
                <label for="nascimento" class="form-label">Nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento" value="2000-01-01">
            </div>

            <div>
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" value="Seu CPF" onblur="validaCPF()">
            </div>

            <div class="form-group">
                <label>Tipo de Perfil:</label><br>

                <input type="radio" name="perfil" value="Aluno" required>
                <label>Aluno</label>

                <input type="radio" name="perfil" value="Professor">
                <label>Professor</label>
            </div>

            <div class="form-group">
                <label>Interesses:</label><br>

                <input type="checkbox" name="interesses" value="HTML">
                <label>HTML</label>

                <input type="checkbox" name="interesses" value="CSS">
                <label>CSS</label>

                <input type="checkbox" name="interesses" value="JavaScript">
                <label>JavaScript</label>
            </div>

            <div class="form-group">
                <label for="estado">Estado:</label>

                <select id="estado" name="estado" class="form-control" required>
                    <option value="">Selecione seu Estado</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="AL">Alagoas</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sobre">Sobre mim:</label>

                <textarea id="sobre" name="sobre" class="form-control" rows="4" required></textarea>
            </div>

            <div class="form-button">
                <button type="button" class="btn btn-primary" onclick="mensagem()">
                    Salvar
                </button>
            </div>

        </form>

    </main>

    <script type="text/javascript">
        function mensagem() {
            const formulario = document.querySelector('.form');
            const msg = document.querySelector('#mensagem');
            const cpf = document.querySelector('#cpf').value;
            const interesses = document.querySelectorAll(
                'input[name="interesses"]:checked'
            );

            msg.style.display = 'block';

            if (!formulario.checkValidity()) {
                formulario.reportValidity();
                msg.textContent = 'Preencha os campos obrigatórios.';
                return;
            }

            if (cpf.replace(/\D/g, '').length !== 11) {
                msg.textContent = 'CPF inválido! Deve conter 11 números.';
                return;
            }

            if (interesses.length === 0) {
                msg.textContent = 'Selecione pelo menos um interesse.';
                return;
            }

            msg.textContent = 'Perfil salvo com sucesso!'
        }

        function validaCPF() {
            const cpf = document.querySelector('#cpf').value;
            // Implement CPF validation logic here
            console.log(cpf);
            if (cpf.length !== 11) {
                const msg = document.querySelector('#mensagem');
                msg.style.display = 'block';
                msg.textContent = 'CPF inválido! Deve conter 11 números.';
            }
        }
    </script>

</body>

</html>
