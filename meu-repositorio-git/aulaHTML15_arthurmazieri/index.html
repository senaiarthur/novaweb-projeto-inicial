<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Cadastro de Usuário</h1>
    </header>

    <main>
        <form class="form" onsubmit="cadastrar(event)">

            <!-- Mensagem exibida no topo do formulário -->
            <div id="mensagem" class="alert" role="alert" hidden></div>

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    minlength="6"
                    required>
            </div>

            <p id="previsualizacao">
                Nome digitado: nenhum
            </p>

            <button type="submit">Cadastrar</button>

        </form>
    </main>

    <script>
        function cadastrar(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            mensagem.hidden = false;

            if (nome === "" || email === "" || senha === "") {
                mensagem.textContent = "Preencha todos os campos.";
                mensagem.className = "alert erro";
                return;
            }

            if (senha.length < 6) {
                mensagem.textContent =
                    "A senha deve ter pelo menos 6 caracteres.";
                mensagem.className = "alert erro";
                return;
            }

            mensagem.textContent =
                "Cadastrado com sucesso! Bem-vindo, " + nome + "!";

            mensagem.className = "alert sucesso";
        }

        // Captura o nome enquanto o usuário digita
        document.getElementById("nome").addEventListener("input", function() {
            const nome = this.value.trim();

            document.getElementById("previsualizacao").textContent =
                "Nome digitado: " + (nome || "nenhum");
        });
    </script>
