<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blog Culinário</title>
    <link rel="stylesheet" href="assets/css/estilos.css">

    <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
>

    <script src="assets/js/script.js" defer></script>
</head>
<body class="pagina-login">

    <header class="cabecalho-login">
        <h2>♨ Blog Culinário</h2>
        <nav>
            <a href="dashboard.html">Início</a>
            <a href="usuarios.html">Usuários</a>
        </nav>
    </header>

    <main class="login">

        <h1>Login</h1>
        <p>Entre em sua conta</p>

        <form id="formLogin">

            <label>Nome de Usuário</label>
            <input type="text" placeholder="Nome" required>

            <label>E-mail</label>
            <input type="email" placeholder="E-mail" required>

            <label>Senha</label>
            <input type="password" placeholder="Senha" required>

            <button type="submit">Entrar</button>

            <p id="mensagem"></p>

        </form>

        <div class="links-login">
            <a href="#">Cadastre-se</a>
            <a href="#">Esqueci minha senha</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Blog Culinário. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
