
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Blog Culinário</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
    <script src="assets/js/script.js" defer></script>

    <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    >

    <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
    >

    <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
    >

</head>
<body class="pagina-login">

    <header class="cabecalho-login">

        <a href="dashboard.html" class="logo">
            <img src="assets/icons/udon.svg" alt="">
            Blog Culinário
        </a>

    </header>

    <main class="login">

        <h1>Login</h1>
        <p>Entre em sua conta</p>

        <form id="formLogin">

            <label for="usuario">Nome de Usuário</label>
            <input
                type="text"
                id="usuario"
                placeholder="Nome"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">Entrar</button>

            <p id="mensagem"></p>

        </form>

        <div class="links-login">
            <a href="#">Cadastre-se</a>
            <a href="#">Esqueci minha senha</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Blog Culinário. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
